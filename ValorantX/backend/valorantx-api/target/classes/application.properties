spring.application.name=valorantx-api
server.port=8080

# Windows Integrated Security requires the native DLL copied to target/native by Maven.
spring.datasource.url=jdbc:sqlserver://JNSCORP\\MSSQLSERVER01;databaseName=ValorantX;encrypt=true;trustServerCertificate=true;integratedSecurity=true;loginTimeout=30;
spring.datasource.username=
spring.datasource.password=
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
